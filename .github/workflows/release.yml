name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Static Linux executables run on any distribution.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      TARGET: ${{ matrix.target }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Check that the tag matches the crate version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          test "$TAG" = "v$version"
      - run: cargo build --release --locked --target "$TARGET"
      - name: Test the executable that will ship
        run: |
          binary="target/$TARGET/release/vault-sync"
          test "$("$binary" --version)" = "vault-sync $TAG"
          VAULT_SYNC_TEST_BINARY="$binary" cargo test --locked
      - name: Package
        run: |
          name="vault-sync-$TARGET"
          mkdir -p "dist/$name/bin"
          cp "target/$TARGET/release/vault-sync" "dist/$name/bin/"
          cp install.sh config.example.json README.md LICENSE "dist/$name/"
          tar -czf "dist/$name.tar.gz" -C dist "$name"
          tar -tzvf "dist/$name.tar.gz"
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        working-directory: dist
        run: |
          sha256sum -- *.tar.gz > SHA256SUMS
          gh release create "$TAG" ./*.tar.gz SHA256SUMS --verify-tag --title "$TAG" --generate-notes
